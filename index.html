<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objectives Mapper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a1f44;
      color: #ffffff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #arrow-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: rgba(10, 31, 68, 0.95);
      border-bottom: 1px solid #1e3a6e;
      z-index: 30;
    }

    header h1 {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #fff;
    }

    #legend {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #btn-all {
      background: #3a6ab8;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    #btn-all:hover { background: #4a7acc; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: opacity 0.15s, border-color 0.15s;
    }
    .legend-item:hover { border-color: rgba(255,255,255,0.2); }
    .legend-item.inactive { opacity: 0.3; }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-text {
      line-height: 1.3;
    }

    .legend-name { font-weight: bold; font-size: 12px; }
    .legend-role { color: #a0b4cc; font-size: 10px; }

    #app {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      height: 100vh;
      padding: 72px 20px 20px;
      position: relative;
      z-index: 1;
    }

    #left-panel, #right-panel {
      flex: 1;
      position: relative;
      min-height: 100%;
    }

    #center-column {
      flex: 0 0 300px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 20px;
      position: relative;
      z-index: 2;
    }

    .bo-box {
      background: #1a3a6b;
      border: 1px solid #3a6ab8;
      border-radius: 8px;
      padding: 14px 18px;
      text-align: center;
      z-index: 2;
      position: relative;
    }

    .bo-id {
      display: inline-block;
      background: #3a6ab8;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 3px;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .bo-name {
      font-size: 13px;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .bo-summary {
      font-size: 11px;
      color: #a0b4cc;
      line-height: 1.4;
    }

    .personal-card {
      position: fixed;
      width: 240px;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 4px solid var(--eng-color);
      background: #112244;
      cursor: grab;
      user-select: none;
      z-index: 10;
      transition: box-shadow 0.15s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .personal-card.unlinked {
      border-left: none;
      border: 2px dashed var(--eng-color);
      opacity: 0.75;
    }

    .personal-card:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .personal-card.dragging {
      cursor: grabbing;
      z-index: 20;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      transform: scale(1.03);
    }

    .card-engineer {
      font-size: 11px;
      font-weight: bold;
      color: var(--eng-color);
      margin-bottom: 2px;
    }

    .card-role {
      font-size: 10px;
      color: #7090b0;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .smart-rows { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .smart-row  { display: flex; align-items: flex-start; gap: 5px; }
    .smart-label {
      flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px;
      font-size: 9px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; color: #0a1f44;
    }
    .smart-text {
      font-size: 10px; color: #a0b4cc; line-height: 1.3;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1;
    }

    body.smart-hidden .smart-rows { display: none; }
    body.smart-hidden .card-role  { margin-bottom: 0; }

    #btn-smart {
      background: #3a6ab8;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    #btn-smart:hover { background: #4a7acc; }
    #btn-smart.off   { background: #2a3a55; color: #6080a0; }
  </style>
</head>
<body>

<svg id="arrow-layer">
  <defs>
    <marker id="arrow-persona" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arrow-personb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a5d6a7"/>
    </marker>
    <marker id="arrow-personc" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffcc80"/>
    </marker>
    <marker id="arrow-persond" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ce93d8"/>
    </marker>
    <marker id="arrow-persone" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef9a9a"/>
    </marker>
  </defs>
</svg>

<header>
  <h1>Objectives Mapper</h1>
  <div id="legend"><button id="btn-all">All</button><button id="btn-smart">Show SMART</button></div>
</header>

<div id="app">
  <div id="left-panel"></div>
  <div id="center-column"></div>
  <div id="right-panel"></div>
</div>

<script>
  const DATA = {
    businessObjectives: [
      { id: 'BO1', name: 'Improve Platform Reliability',   summary: 'Increase system uptime and reduce production incidents through better monitoring, testing, and infrastructure improvements.' },
      { id: 'BO2', name: 'Accelerate Product Delivery',    summary: 'Reduce development cycle time by improving CI/CD pipelines and development workflows.' },
      { id: 'BO3', name: 'Enhance Application Security',   summary: 'Strengthen security practices including dependency management, vulnerability scanning, and secure coding standards.' },
      { id: 'BO4', name: 'Improve System Performance',     summary: 'Optimize backend services and database queries to reduce latency and improve scalability.' },
      { id: 'BO5', name: 'Increase Test Coverage',         summary: 'Expand automated testing across services to improve confidence in releases and reduce regressions.' },
      { id: 'BO6', name: 'Improve Developer Experience',   summary: 'Simplify development environments, documentation, and internal tooling to improve team productivity.' },
    ],
    engineers: [
      {
        id: 'persona', name: 'Person A', role: 'Senior Software Engineer',
        color: '#4fc3f7', side: 'left',
        objectives: [
          { id: 'persona-1', title: 'Implement distributed tracing',         bo: 'BO1', smart: { specific: 'Deploy OpenTelemetry distributed tracing across the auth, payments, and notifications services.', measurable: 'End-to-end trace visibility for 100% of API requests; MTTR reduced from 45 to under 15 minutes.', achievable: 'OpenTelemetry is industry-standard and well-supported; 3 services is a realistic one-quarter scope.', relevant: 'Enables faster incident diagnosis, directly supporting platform reliability (BO1).', time_bound: 'Complete by end of Q2.' } },
          { id: 'persona-2', title: 'Optimize CI pipeline',                  bo: 'BO2', smart: { specific: 'Parallelise build/test jobs and implement dependency caching across all CI pipeline stages.', measurable: 'Average pipeline time reduced from 18 to under 10 minutes; at least 2 additional deployments per day.', achievable: 'Parallelisation and caching are established techniques with clear tooling support.', relevant: 'Faster pipelines directly accelerate product delivery cycles (BO2).', time_bound: 'Complete by end of Q2.' } },
          { id: 'persona-3', title: 'Introduce security dependency scanning', bo: 'BO3', smart: { specific: 'Integrate Snyk into the CI pipeline to scan all pull requests for known CVEs automatically.', measurable: '100% of PRs scanned; critical/high CVEs block merge; zero unresolved critical CVEs in production.', achievable: 'Snyk integrates with standard CI systems; blocking rules are straightforward to configure.', relevant: 'Automated scanning directly strengthens the dependency security posture (BO3).', time_bound: 'Tool live by end of Q1; zero-critical policy enforced within 30 days of deployment.' } },
          { id: 'persona-4', title: 'Explore ML-based anomaly detection', bo: null, smart: { specific: 'Research and prototype an ML model to detect anomalies in service latency metrics.', measurable: 'Proof-of-concept demo delivered to the team.', achievable: 'Exploratory work, not yet tied to a business objective.', relevant: 'TBD — pending business objective alignment.', time_bound: 'Initial findings by end of Q3.' } },
        ]
      },
      {
        id: 'personb', name: 'Person B', role: 'Backend Software Engineer',
        color: '#a5d6a7', side: 'right',
        objectives: [
          { id: 'personb-1', title: 'Database query optimization',        bo: 'BO1', smart: { specific: 'Profile and rewrite the top 10 slowest queries in the payments and orders API services.', measurable: 'Average query execution time reduced by 40%; p95 API response time below 200ms.', achievable: 'Slow query log analysis is a standard technique; 10 queries is a scoped, realistic target.', relevant: 'Faster queries reduce timeout incidents and support platform reliability (BO1).', time_bound: 'Complete by end of Q2.' } },
          { id: 'personb-2', title: 'Increase service unit test coverage', bo: 'BO5', smart: { specific: 'Write new unit tests for the payments service covering critical flows, error handling, and edge cases.', measurable: 'Coverage increases from 60% to 85%; minimum 120 new test cases written.', achievable: 'A 25-point increase is realistic with focused effort over one quarter.', relevant: 'Higher coverage reduces regressions and improves release confidence (BO5).', time_bound: 'Complete by end of Q2.' } },
          { id: 'personb-3', title: 'Improve local development setup',     bo: 'BO6', smart: { specific: 'Create an automated setup script and documentation for the local development environment.', measurable: 'Onboarding time cut from 2 days to under 2 hours; validated by onboarding 2 new team members.', achievable: 'Scripting env setup is well-understood; documentation is a low-risk deliverable.', relevant: 'Simplified onboarding improves developer productivity and experience (BO6).', time_bound: 'Complete by end of Q1.' } },
        ]
      },
      {
        id: 'personc', name: 'Person C', role: 'Software Engineer',
        color: '#ffcc80', side: 'right',
        objectives: [
          { id: 'personc-1', title: 'Add performance benchmarking',            bo: 'BO4', smart: { specific: 'Implement automated benchmark tests covering the 5 highest-traffic API endpoints.', measurable: 'Baseline p50/p95/p99 metrics established in CI; regressions over 10% trigger a build failure.', achievable: 'Benchmark tooling (e.g. k6) integrates with standard CI pipelines with minimal setup.', relevant: 'Automated benchmarks enable early detection of performance regressions (BO4).', time_bound: 'Complete by end of Q2.' } },
          { id: 'personc-2', title: 'Expand integration tests',                bo: 'BO5', smart: { specific: 'Write integration tests covering the checkout workflow — cart, payment, and order confirmation.', measurable: '30 new tests merged; cross-service test coverage increases from 40% to 70%.', achievable: 'The checkout flow is well-documented and a focused, bounded scope for one quarter.', relevant: 'Integration tests reduce cross-service regressions in the critical checkout path (BO5).', time_bound: 'Complete by end of Q2.' } },
          { id: 'personc-3', title: 'Improve internal developer documentation', bo: 'BO6', smart: { specific: 'Write a developer onboarding guide and ADRs covering all 6 core services.', measurable: 'Documentation satisfaction score of at least 4/5 in the next team survey.', achievable: 'Existing architecture knowledge makes authoring ADRs feasible within one quarter.', relevant: 'Clear documentation reduces onboarding friction and improves developer experience (BO6).', time_bound: 'Complete by end of Q2.' } },
        ]
      },
      {
        id: 'persond', name: 'Person D', role: 'Software Engineer',
        color: '#ce93d8', side: 'right',
        objectives: [
          { id: 'persond-1', title: 'Add performance benchmarking',            bo: 'BO4', smart: { specific: 'Instrument the 3 core backend services with k6 load-testing suites and publish a team performance dashboard.', measurable: 'Weekly automated benchmarks running; alert fires when throughput drops below 500 RPS.', achievable: 'k6 is lightweight and integrates with CI; dashboarding is achievable via existing tooling.', relevant: 'Continuous load testing ensures the platform sustains growth targets (BO4).', time_bound: 'Complete by end of Q2.' } },
          { id: 'persond-2', title: 'Expand integration tests',                bo: 'BO5', smart: { specific: 'Write integration tests for the returns and refunds cross-service workflow.', measurable: '25 new tests delivered; manual QA time reduced by 50%; zero untested cross-service failure paths.', achievable: 'The returns/refunds workflow is a bounded scope suitable for one quarter.', relevant: 'Automated tests reduce manual QA overhead and improve release confidence (BO5).', time_bound: 'Complete by end of Q2.' } },
          { id: 'persond-3', title: 'Improve internal developer documentation', bo: 'BO6', smart: { specific: 'Write and publish runbooks for the 5 most common production incidents.', measurable: 'Average incident resolution time reduced by 30% in the following quarter\'s post-incident reviews.', achievable: 'Runbooks are a well-established format; 5 incidents is a manageable, scoped target.', relevant: 'Clear runbooks reduce resolution time and improve the on-call experience (BO6).', time_bound: 'Complete by end of Q1.' } },
        ]
      },
      {
        id: 'persone', name: 'Person E', role: 'Software Engineer',
        color: '#ef9a9a', side: 'right',
        objectives: [
          { id: 'persone-1', title: 'Add performance benchmarking',            bo: 'BO4', smart: { specific: 'Integrate benchmark tests for the reporting service into the CI pipeline.', measurable: 'p95 report-generation latency below 3 seconds for datasets up to 100k records.', achievable: 'The reporting service is a single bounded system with well-defined inputs and outputs.', relevant: 'A latency baseline prevents performance regressions from reaching production (BO4).', time_bound: 'Complete by end of Q2.' } },
          { id: 'persone-2', title: 'Expand integration tests',                bo: 'BO5', smart: { specific: 'Write integration tests for the notification service\'s cross-service trigger paths.', measurable: '20 new tests; 80% branch coverage for dispatch paths; top 3 recurring bugs eliminated.', achievable: 'Notification triggers are well-understood; 20 tests is realistic within one quarter.', relevant: 'Eliminating recurring notification bugs improves reliability and test coverage (BO5).', time_bound: 'Complete by end of Q2.' } },
          { id: 'persone-3', title: 'Improve internal developer documentation', bo: 'BO6', smart: { specific: 'Create a living API contract document for all internal service interfaces, signed off by each service owner.', measurable: 'Cross-team integration bugs reduced by 40% in the following quarter.', achievable: 'Service owners are available to review; a structured contract format is reusable across teams.', relevant: 'API contracts reduce integration mismatches and improve cross-team developer experience (BO6).', time_bound: 'Complete by end of Q2.' } },
        ]
      },
    ]
  };

  const STATE = { dragging: null };
  const arrowMap = {};
  const FILTER = new Set(DATA.engineers.map(e => e.id)); // all active by default

  function applyFilter() {
    DATA.engineers.forEach(eng => {
      const visible = FILTER.has(eng.id);
      eng.objectives.forEach(obj => {
        const card = document.getElementById(`card-${obj.id}`);
        if (card) card.style.display = visible ? '' : 'none';
        const entry = arrowMap[obj.id];
        if (entry) entry.path.style.display = visible ? '' : 'none';
      });
      const legendItem = document.querySelector(`.legend-item[data-eng-id="${eng.id}"]`);
      if (legendItem) legendItem.classList.toggle('inactive', !visible);
    });
  }

  // Render legend
  function renderLegend() {
    const legend = document.getElementById('legend');

    document.getElementById('btn-all').addEventListener('click', () => {
      DATA.engineers.forEach(e => FILTER.add(e.id));
      applyFilter();
    });

    const btnSmart = document.getElementById('btn-smart');
    btnSmart.addEventListener('click', () => {
      document.body.classList.toggle('smart-hidden');
      btnSmart.classList.toggle('off', document.body.classList.contains('smart-hidden'));
    });

    DATA.engineers.forEach(eng => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.dataset.engId = eng.id;
      item.innerHTML = `
        <div class="legend-dot" style="background:${eng.color}"></div>
        <div class="legend-text">
          <div class="legend-name">${eng.name}</div>
          <div class="legend-role">${eng.role}</div>
        </div>`;
      item.addEventListener('click', () => {
        if (FILTER.has(eng.id)) {
          FILTER.delete(eng.id);
        } else {
          FILTER.add(eng.id);
        }
        applyFilter();
      });
      legend.appendChild(item);
    });
  }

  // Render BO boxes in center column
  function renderBOBoxes() {
    const col = document.getElementById('center-column');
    DATA.businessObjectives.forEach(bo => {
      const div = document.createElement('div');
      div.className = 'bo-box';
      div.id = bo.id;
      div.innerHTML = `
        <span class="bo-id">${bo.id}</span>
        <span class="bo-name">${bo.name}</span>
        <span class="bo-summary">${bo.summary}</span>`;
      col.appendChild(div);
    });
  }

  // Create and position all personal objective cards
  function initCards() {
    const centerCol = document.getElementById('center-column');
    const centerRect = centerCol.getBoundingClientRect();
    const unlinkedCountBySide = { left: 0, right: 0 };

    DATA.engineers.forEach(eng => {
      eng.objectives.forEach((obj, i) => {
        let boMidY;
        if (obj.bo) {
          const boEl = document.getElementById(obj.bo);
          const boRect = boEl.getBoundingClientRect();
          boMidY = boRect.top + boRect.height / 2;
        } else {
          // Stack unlinked cards below the main content area
          const idx = unlinkedCountBySide[eng.side]++;
          boMidY = window.innerHeight - 120 - idx * 130;
        }

        let x;
        const rightOffsets = { personb: 30, personc: 270, persond: 510, persone: 750 };
        if (eng.side === 'left') {
          x = centerRect.left - 230;
        } else {
          x = centerRect.right + (rightOffsets[eng.id] ?? 30);
        }

        const card = document.createElement('div');
        card.className = 'personal-card' + (obj.bo ? '' : ' unlinked');
        card.id = `card-${obj.id}`;
        card.dataset.objId = obj.id;
        card.dataset.side = eng.side;
        card.style.setProperty('--eng-color', eng.color);
        card.style.top  = (boMidY - 55) + 'px';
        card.style.left = x + 'px';
        const s = obj.smart;
        card.title = `S: ${s.specific}\nM: ${s.measurable}\nA: ${s.achievable}\nR: ${s.relevant}\nT: ${s.time_bound}`;
        card.innerHTML = `
          <div class="card-engineer">${eng.name}</div>
          <div class="card-role">${eng.role}</div>
          <div class="card-title">${obj.title}</div>
          <div class="smart-rows">
            <div class="smart-row"><span class="smart-label" style="background:#4fc3f7">S</span><span class="smart-text">${s.specific}</span></div>
            <div class="smart-row"><span class="smart-label" style="background:#a5d6a7">M</span><span class="smart-text">${s.measurable}</span></div>
            <div class="smart-row"><span class="smart-label" style="background:#ffcc80">A</span><span class="smart-text">${s.achievable}</span></div>
            <div class="smart-row"><span class="smart-label" style="background:#ce93d8">R</span><span class="smart-text">${s.relevant}</span></div>
            <div class="smart-row"><span class="smart-label" style="background:#ef9a9a">T</span><span class="smart-text">${s.time_bound}</span></div>
          </div>`;
        document.body.appendChild(card);
      });
    });
  }

  // Create SVG path elements for arrows
  function initArrows() {
    const svg = document.getElementById('arrow-layer');
    DATA.engineers.forEach(eng => {
      eng.objectives.forEach(obj => {
        if (!obj.bo) return; // no arrow for unlinked objectives
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('stroke', eng.color);
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', 'none');
        path.setAttribute('opacity', '0.75');
        path.setAttribute('marker-end', `url(#arrow-${eng.id})`);
        svg.appendChild(path);
        arrowMap[obj.id] = { path, side: eng.side };
      });
    });
  }

  function getConnectorPoints(cardEl, boEl, side) {
    const cr = cardEl.getBoundingClientRect();
    const br = boEl.getBoundingClientRect();
    if (side === 'left') {
      return { x1: cr.right, y1: cr.top + cr.height / 2, x2: br.left,  y2: br.top + br.height / 2 };
    } else {
      return { x1: cr.left,  y1: cr.top + cr.height / 2, x2: br.right, y2: br.top + br.height / 2 };
    }
  }

  function makeCubicBezier(x1, y1, x2, y2, side) {
    const dx = Math.abs(x2 - x1) * 0.5;
    if (side === 'left') {
      return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    } else {
      return `M ${x1} ${y1} C ${x1 - dx} ${y1}, ${x2 + dx} ${y2}, ${x2} ${y2}`;
    }
  }

  function updateAllArrows() {
    DATA.engineers.forEach(eng => {
      eng.objectives.forEach(obj => {
        if (!obj.bo) return; // no arrow for unlinked objectives
        const cardEl = document.getElementById(`card-${obj.id}`);
        const boEl   = document.getElementById(obj.bo);
        const { path, side } = arrowMap[obj.id];
        const pts = getConnectorPoints(cardEl, boEl, side);
        path.setAttribute('d', makeCubicBezier(pts.x1, pts.y1, pts.x2, pts.y2, side));
      });
    });
  }

  // Drag handlers
  function onMouseDown(e) {
    const card = e.target.closest('.personal-card');
    if (!card) return;
    e.preventDefault();
    const rect = card.getBoundingClientRect();
    STATE.dragging = {
      cardEl: card,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
    };
    card.classList.add('dragging');
  }

  function onMouseMove(e) {
    if (!STATE.dragging) return;
    const { cardEl, offsetX, offsetY } = STATE.dragging;
    cardEl.style.left = (e.clientX - offsetX) + 'px';
    cardEl.style.top  = (e.clientY - offsetY) + 'px';
    updateAllArrows();
  }

  function onMouseUp() {
    if (!STATE.dragging) return;
    STATE.dragging.cardEl.classList.remove('dragging');
    STATE.dragging = null;
  }

  document.addEventListener('mousedown', onMouseDown);
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup',   onMouseUp);
  window.addEventListener('resize', updateAllArrows);

  // Init
  document.addEventListener('DOMContentLoaded', () => {
    renderLegend();
    renderBOBoxes();
    initArrows();
    initCards();
    updateAllArrows();
  });
</script>
</body>
</html>
